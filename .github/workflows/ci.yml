name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Instalar dependencias (las del uv.lock, sin cambios)
        run: uv sync --frozen

      - name: Formato (black)
        run: uv run black --check src tests

      - name: Estilo (flake8)
        run: uv run flake8 src tests

      - name: Tests (pytest)
        run: uv run pytest -q
